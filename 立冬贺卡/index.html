<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>立冬快乐</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
body { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
#sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
.text { position: fixed; left: 0; right: 0; bottom: 7vh; text-align: center; color: #fff; z-index: 2; padding: 0 20px; pointer-events: none; }
.text h1 { font-size: clamp(34px, 9vw, 58px); font-weight: 700; letter-spacing: 0.12em; text-shadow: 0 0 18px rgba(255, 120, 180, 0.85), 0 2px 12px rgba(0,0,0,0.8); }
.text h1 .pink { color: #ffb3d1; }
.text .sub { margin-top: 10px; font-size: clamp(19px, 5vw, 28px); letter-spacing: 0.28em; color: #ffd7e8; text-shadow: 0 0 14px rgba(255, 120, 180, 0.7); }
.text .company { margin-top: 26px; font-size: clamp(16px, 4.4vw, 22px); line-height: 1.9; letter-spacing: 0.08em; color: #f2f2f2; text-shadow: 0 1px 10px rgba(0,0,0,0.9); }
.text .company span { display: block; }
@media (min-height: 700px) { .text { bottom: 9vh; } }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="text">
<h1>立冬快乐 <span class="pink">&#9924;</span></h1>
<div class="sub">岁岁平安 &#128151;</div>
<div class="company">
<span>奥来电器祝全体员工节日快乐</span>
<span>好好保暖，好好生活</span>
</div>
</div>
<script>
var canvas = document.getElementById('sky');
var ctx = canvas.getContext('2d');
var W = 0, H = 0, DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// 星空：随机星星，闪烁
var stars = [];
for (var i = 0; i < 200; i++) {
  stars.push({
    x: Math.random(), y: Math.random() * 0.85,
    r: Math.random() * 1.4 + 0.4,
    p: Math.random() * Math.PI * 2,
    s: 0.5 + Math.random() * 1.5,
    c: ['#ffffff', '#cfe8ff', '#ffd7e8', '#fff6c9'][Math.floor(Math.random() * 4)]
  });
}
// 漂浮光点：蓝粉白，缓慢上飘
var floats = [];
for (var j = 0; j < 70; j++) {
  floats.push({
    x: Math.random(), y: Math.random(),
    r: Math.random() * 2 + 0.8,
    vy: 0.00012 + Math.random() * 0.00025,
    vx: (Math.random() - 0.5) * 0.00015,
    p: Math.random() * Math.PI * 2,
    c: ['#7ec8ff', '#ff9ec7', '#ffffff', '#ffb3d1'][Math.floor(Math.random() * 4)]
  });
}
// 地面光点：爱心下方一排白色光点
var ground = [];
for (var k = 0; k < 90; k++) {
  ground.push({ t: Math.random() * Math.PI * 2, r: Math.random() * 1.6 + 0.5, p: Math.random() * Math.PI * 2 });
}

// 爱心：参数方程取点，内部填充
var heart = [];
var N = 900;
for (var n = 0; n < N; n++) {
  var t = Math.random() * Math.PI * 2;
  var hx = 16 * Math.pow(Math.sin(t), 3);
  var hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  var f = Math.sqrt(Math.random());
  var shade = Math.random();
  heart.push({
    x: hx * f, y: hy * f,
    r: Math.random() * 2.1 + 0.9,
    p: Math.random() * Math.PI * 2,
    c: shade < 0.55 ? '#ff6fa5' : (shade < 0.85 ? '#ff9ec7' : '#ffd0e6')
  });
}
function draw(now) {
  ctx.clearRect(0, 0, W, H);
  // 背景渐变
  var bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#050510');
  bg.addColorStop(0.55, '#0a0618');
  bg.addColorStop(1, '#000000');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);
  var sec = now / 1000;
  // 星星
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    var a = 0.35 + 0.65 * Math.abs(Math.sin(sec * s.s + s.p));
    ctx.globalAlpha = a;
    ctx.fillStyle = s.c;
    ctx.beginPath();
    ctx.arc(s.x * W, s.y * H, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 爱心中心与大小
  var cx = W / 2;
  var cy = H * 0.36;
  var base = Math.min(W, H) * 0.032;
  var beat = 1 + 0.07 * Math.sin(sec * 2.2) + 0.03 * Math.sin(sec * 4.4);
  var rot = Math.sin(sec * 0.35) * 0.18;
  var cosR = Math.cos(rot);
  // 爱心光晕
  var glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, base * 17 * beat);
  glow.addColorStop(0, 'rgba(255, 90, 160, 0.22)');
  glow.addColorStop(1, 'rgba(255, 90, 160, 0)');
  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(cx, cy, base * 17 * beat, 0, Math.PI * 2);
  ctx.fill();
  // 爱心光点
  for (var m = 0; m < heart.length; m++) {
    var hp = heart[m];
    var xr = hp.x * cosR;
    var px = cx + xr * base * beat;
    var py = cy - hp.y * base * beat;
    var al = 0.55 + 0.45 * Math.sin(sec * 2 + hp.p);
    ctx.globalAlpha = al;
    ctx.fillStyle = hp.c;
    ctx.beginPath();
    ctx.arc(px, py, hp.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 地面光点
  var gy = H * 0.62;
  var gw = Math.min(W * 0.36, 260);
  for (var g = 0; g < ground.length; g++) {
    var gp = ground[g];
    var gx = cx + Math.cos(gp.t) * gw;
    var gyy = gy + Math.sin(gp.t) * 10;
    ctx.globalAlpha = 0.35 + 0.5 * Math.abs(Math.sin(sec * 1.5 + gp.p));
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(gx, gyy, gp.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  // 漂浮光点
  for (var f = 0; f < floats.length; f++) {
    var fl = floats[f];
    fl.y -= fl.vy;
    fl.x += fl.vx;
    if (fl.y < -0.02) { fl.y = 1.02; fl.x = Math.random(); }
    if (fl.x < 0) fl.x = 1; if (fl.x > 1) fl.x = 0;
    ctx.globalAlpha = 0.3 + 0.6 * Math.abs(Math.sin(sec + fl.p));
    ctx.fillStyle = fl.c;
    ctx.beginPath();
    ctx.arc(fl.x * W, fl.y * H, fl.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
</body>
</html>
