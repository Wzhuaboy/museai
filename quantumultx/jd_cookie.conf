# jd_cookie.conf - QuantumultX 京东 Cookie 快取订阅片段
# QX 里: 重写 -> 引用 -> 右上角 + -> 粘贴下面这个订阅地址
# https://raw.githubusercontent.com/Wzhuaboy/museai/main/quantumultx/jd_cookie.conf
# 开启后用 Safari 打开 https://bean.m.jd.com 点一次签到, 收到通知点一下即复制.

[rewrite_local]
^https:\/\/api\.m\.jd\.com\/client\.action.*functionId=signBean url script-request-header https://raw.githubusercontent.com/Wzhuaboy/museai/main/quantumultx/jd_cookie.js
^https:\/\/wq\.jd\.com\/user_new\/info\/GetJDUserInfoUnion url script-request-header https://raw.githubusercontent.com/Wzhuaboy/museai/main/quantumultx/jd_cookie.js

[mitm]
hostname = api.m.jd.com, wq.jd.com
