<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>USAGI 3x3 华容道</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #ffdfb8; color: #3d2a1a;
    display: flex; justify-content: center; padding: 20px 14px 32px;
  }
  .wrap { width: 100%; max-width: 480px; }
  h1 { text-align: center; font-size: 24px; margin: 6px 0 4px; letter-spacing: 1px; }
  .sub { text-align: center; font-size: 14px; color: #7a5a3d; margin: 0 0 14px; line-height: 1.6; }
  .stats {
    display: flex; gap: 10px; margin-bottom: 12px;
  }
  .stat {
    flex: 1; background: #fff8ee; border: 1px solid #f0c99a; border-radius: 12px;
    padding: 10px 6px; text-align: center; box-shadow: 0 2px 0 rgba(122, 82, 30, .15);
  }
  .stat b { display: block; font-size: 20px; }
  .stat span { font-size: 12px; color: #8a6a4d; }
  .tray {
    background: #b36a2e; padding: 12px; border-radius: 22px;
    box-shadow: 0 10px 0 #7c4216, 0 18px 30px rgba(90, 50, 10, .35), inset 0 2px 0 rgba(255,255,255,.35);
  }
  .board {
    display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px;
    aspect-ratio: 274 / 461; width: 100%;
    background: #e08a3e; border-radius: 14px; padding: 8px;
    box-shadow: inset 0 4px 14px rgba(60, 30, 0, .45), inset 0 -1px 0 rgba(255,255,255,.25);
    touch-action: pan-y;
  }
  .tile {
    border-radius: 10px; cursor: pointer; position: relative; overflow: hidden;
    background-image: var(--img); background-size: 300% 300%; background-repeat: no-repeat;
    box-shadow: 0 5px 0 rgba(60, 30, 0, .35), 0 10px 16px rgba(60, 30, 0, .30), inset 0 2px 0 rgba(255,255,255,.55), inset 0 -2px 0 rgba(0,0,0,.18), inset 2px 0 0 rgba(255,255,255,.25), inset -2px 0 0 rgba(0,0,0,.12);
    transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .tile:hover { filter: brightness(1.04); }
  .tile:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(60, 30, 0, .35), 0 4px 8px rgba(60, 30, 0, .30), inset 0 2px 0 rgba(255,255,255,.55); }
  .tile .num {
    display: none; position: absolute; left: 6px; top: 6px; z-index: 2;
    background: rgba(0,0,0,.55); color: #fff; font-size: 12px; line-height: 1;
    padding: 4px 6px; border-radius: 999px;
  }
  .show-num .tile .num { display: block; }
  .blank {
    border-radius: 10px; position: relative;
    background: #a85c22;
    box-shadow: inset 0 8px 18px rgba(40, 18, 0, .65), inset 0 -1px 0 rgba(255,255,255,.20), inset 0 0 0 2px rgba(0,0,0,.15);
  }
  .blank::after {
    content: ""; position: absolute; inset: 20%;
    border: 2px dashed rgba(255, 235, 200, .45); border-radius: 8px;
  }
  .blank::before {
    content: "空位"; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 12px; color: rgba(255, 235, 200, .65); letter-spacing: 2px;
  }
  .btns { display: flex; gap: 10px; margin-top: 16px; }
  button {
    flex: 1; border: 0; border-radius: 12px; padding: 13px 6px; font-size: 16px; font-weight: 700; cursor: pointer;
    background: #3d2a1a; color: #fff; box-shadow: 0 4px 0 #1f140a;
  }
  button:active { transform: translateY(3px); box-shadow: 0 1px 0 #1f140a; }
  button.secondary { background: #fff8ee; color: #3d2a1a; border: 1px solid #e8c69a; box-shadow: 0 4px 0 #d9b98a; }
  .toggles { display: flex; gap: 10px; margin-top: 12px; }
  .toggles label {
    flex: 1; background: #fff8ee; border: 1px solid #f0c99a; border-radius: 10px;
    padding: 10px 8px; font-size: 14px; text-align: center; cursor: pointer;
  }
  .win {
    display: none; margin-top: 14px; background: #fff8ee; border: 2px solid #ffb347; border-radius: 14px;
    padding: 14px; text-align: center; font-size: 16px; font-weight: 700;
  }
  .win.show { display: block; }
  .win small { display: block; font-weight: 400; color: #7a5a3d; margin-top: 4px; font-size: 13px; }
  .ref { display: none; margin-top: 14px; text-align: center; }
  .ref.show { display: block; }
  .ref img { width: 180px; border-radius: 12px; border: 3px solid #fff; box-shadow: 0 6px 16px rgba(0,0,0,.2); }
  .ref div { font-size: 12px; color: #7a5a3d; margin-top: 6px; }
  .note { margin-top: 14px; font-size: 13px; line-height: 1.7; color: #7a5a3d; background: rgba(255,255,255,.55); border-radius: 12px; padding: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>USAGI 华容道</h1>
  <p class="sub">3 x 3 图案拼图 · 点一下空位旁边的块，它就会滑进去</p>
  <div class="stats">
    <div class="stat"><b id="moves">0</b><span>步数</span></div>
    <div class="stat"><b id="time">00:00</b><span>用时</span></div>
    <div class="stat"><b id="status">已打乱</b><span>状态</span></div>
  </div>
  <div class="tray"><div class="board" id="board"></div></div>
  <div class="btns">
    <button id="shuffleBtn">打乱重玩</button>
    <button class="secondary" id="resetBtn">还原原图</button>
  </div>
  <div class="toggles">
    <label><input type="checkbox" id="showRef"> 看原图</label>
    <label><input type="checkbox" id="showNum"> 显示序号</label>
  </div>
  <div class="win" id="win">拼好啦，USAGI 完整了！<small id="winDetail"></small></div>
  <div class="ref" id="ref"><img id="refImg" alt="原图"><div>原图对照：拼好后右下角是下沉空位</div></div>
  <div class="note">
    玩法说明：原图已先裁掉四周纯橙色边，只留兔子本体加 USAGI 字，9 格每格都有图案，不再有两块纯色。右下角那个下沉格就是空位，它本身不能拖动、也不算一块图块，只能把上下左右相邻的 8 块图滑进去。拼好时，8 块图全部归位，下沉空位正好回到右下角，就像实体拼图板留出的那个凹槽一样。<br>
    手机上也可以在棋盘上滑动：往空位方向滑一下，相邻的块就会滑过去；键盘方向键同样可以玩。
  </div>
</div>

      if (v === 8) {
        var b = document.createElement("div");
        b.className = "blank";
        boardEl.appendChild(b);
      } else {
        var t = document.createElement("div");
        t.className = "tile";
        t.style.setProperty("--img", "url(" + IMG + ")");
        t.style.backgroundPosition = bgPos(v);
        t.setAttribute("data-pos", i);
        t.setAttribute("aria-label", "第" + (v + 1) + "块");
        var n = document.createElement("span");
        n.className = "num";
        n.textContent = v + 1;
        t.appendChild(n);
        t.addEventListener("click", function() { tryMove(parseInt(this.getAttribute("data-pos"), 10)); });
        boardEl.appendChild(t);
      }
    }
    movesEl.textContent = moves;
    timeEl.textContent = fmt(seconds);
  }
  function blankPos() { return board.indexOf(8); }
  function canSwap(a, b) {
    var ax = a % 3, ay = Math.floor(a / 3), bx = b % 3, by = Math.floor(b / 3);
    return Math.abs(ax - bx) + Math.abs(ay - by) === 1;
  }
  function tryMove(pos) {
    var bp = blankPos();
    if (!canSwap(pos, bp)) return;
    var tmp = board[pos]; board[pos] = board[bp]; board[bp] = tmp;
    moves++;
    if (!playing) { playing = true; startTimer(); statusEl.textContent = "进行中"; }
    render();
    checkWin();
  }
  function checkWin() {
    if (playing && isSolved()) {
      playing = false; stopTimer(); statusEl.textContent = "已完成";
      winDetailEl.textContent = "用了 " + moves + " 步，用时 " + fmt(seconds);
      winEl.className = "win show";
    }
  }
  function shuffle() {
    board = solved.slice();
    var last = -1;
    for (var i = 0; i < 120; i++) {
      var bp = blankPos();
      var opts = [];
      var dirs = [-3, 3, -1, 1];
      for (var j = 0; j < dirs.length; j++) {
        var np = bp + dirs[j];
        if (np < 0 || np > 8) continue;
        if (dirs[j] === -1 && bp % 3 === 0) continue;
        if (dirs[j] === 1 && bp % 3 === 2) continue;
        if (np === last) continue;
        opts.push(np);
      }
      var pick = opts[Math.floor(Math.random() * opts.length)];
      last = bp;
      var tmp = board[pick]; board[pick] = board[bp]; board[bp] = tmp;
    }
    if (isSolved()) shuffle();
    moves = 0; seconds = 0; playing = true;
    statusEl.textContent = "已打乱"; winEl.className = "win";
    startTimer(); render();
  }
  function reset() {
    board = solved.slice(); moves = 0; seconds = 0; playing = false;
    stopTimer(); statusEl.textContent = "已还原"; winEl.className = "win"; render();
  }
  document.getElementById("shuffleBtn").addEventListener("click", shuffle);
  document.getElementById("resetBtn").addEventListener("click", reset);
  document.getElementById("showRef").addEventListener("change", function(e) {
    document.getElementById("ref").className = e.target.checked ? "ref show" : "ref";
  });
  document.getElementById("showNum").addEventListener("change", function(e) {
    boardEl.className = e.target.checked ? "board show-num" : "board";
  });
  document.addEventListener("keydown", function(e) {
    var bp = blankPos(), target = -1;
    if (e.key === "ArrowUp") target = bp + 3;
    if (e.key === "ArrowDown") target = bp - 3;
    if (e.key === "ArrowLeft") target = bp + 1;
    if (e.key === "ArrowRight") target = bp - 1;
    if (target >= 0 && target <= 8 && canSwap(target, bp)) { e.preventDefault(); tryMove(target); }
  });
  boardEl.addEventListener("touchstart", function(e) {
    var t = e.changedTouches[0]; touchX = t.clientX; touchY = t.clientY;
  }, { passive: true });
  boardEl.addEventListener("touchend", function(e) {
    var t = e.changedTouches[0];
    var dx = t.clientX - touchX, dy = t.clientY - touchY;
    if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
    var bp = blankPos(), target = -1;
    if (Math.abs(dx) > Math.abs(dy)) target = dx > 0 ? bp - 1 : bp + 1;
    else target = dy > 0 ? bp - 3 : bp + 3;
    if (target >= 0 && target <= 8 && canSwap(target, bp)) tryMove(target);
  }, { passive: true });

  document.getElementById("refImg").src = IMG;
  shuffle();
</script>
</body>
</html>
