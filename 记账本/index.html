<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>阿华手帐本</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f2f2; color: #333;
    display: flex; justify-content: center; padding: 20px 14px 40px;
  }
  .wrap { width: 100%; max-width: 480px; }
  h1 { text-align: center; font-size: 24px; margin: 6px 0 4px; letter-spacing: 2px; }
  .sub { text-align: center; font-size: 13px; color: #999; margin: 0 0 16px; line-height: 1.6; }
  .card {
    background: #fff; border-radius: 16px; padding: 16px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .08); margin-bottom: 14px;
  }
  .card h2 { font-size: 16px; margin: 0 0 12px; }
  .summary h2 { margin-bottom: 10px; }
  .sum-row { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 2px; border-bottom: 1px solid #f0f0f0; }
  .sum-row:last-child { border-bottom: none; }
  .sum-label { font-size: 15px; font-weight: 700; }
  .sum-vals { text-align: right; font-size: 14px; line-height: 1.7; }
  .in { color: #1a9e54; }
  .out { color: #dd1f16; }
  .bal { color: #333; font-weight: 700; }
  .type-row { display: flex; gap: 8px; }
  .type-btn {
    flex: 1; padding: 13px 0; font-size: 17px; font-family: inherit; border-radius: 999px;
    border: none; color: #fff; cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 3px 0 rgba(0, 0, 0, .25);
  }
  .type-btn:active { transform: translateY(2px); box-shadow: none; }
  #btnOut { background: #dd1f16; }
  #btnIn { background: #1a9e54; }
  .cat-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 4px; }
  .cat-chip {
    padding: 8px 16px; font-size: 14px; font-family: inherit; border-radius: 999px;
    border: 1.5px solid #ddd; background: #fff; color: #666; cursor: pointer;
  }
  .cat-chip.on-out { border-color: #dd1f16; background: #fdeceb; color: #dd1f16; font-weight: 700; }
  .cat-chip.on-in { border-color: #1a9e54; background: #e7f6ec; color: #1a9e54; font-weight: 700; }
  label { display: block; font-size: 14px; color: #666; margin: 10px 0 5px; }
  input {
    width: 100%; padding: 12px; font-size: 16px; font-family: inherit;
    border: 1px solid #ddd; border-radius: 10px; background: #fff; color: #333;
  }
  input:focus { outline: none; border-color: #333; }
  #mAmount { font-size: 26px; font-weight: 700; padding: 14px; }
  .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 2px; border-bottom: 1px solid #f0f0f0;
  }
  .item:last-child { border-bottom: none; }
  .item .left { min-width: 0; }
  .item .cat { font-size: 15px; font-weight: 700; }
  .item .meta { font-size: 12px; color: #999; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .item .right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .item .amt { font-size: 16px; font-weight: 700; }
  .del { border: none; background: none; color: #bbb; font-size: 18px; cursor: pointer; padding: 4px 6px; }
  .del:active { color: #dd1f16; }
  .empty { text-align: center; color: #aaa; font-size: 14px; padding: 12px 0 4px; }
  .foot { text-align: center; font-size: 12px; color: #aaa; line-height: 1.7; margin-top: 6px; }
  .sync-status { font-size: 14px; color: #666; line-height: 1.7; margin-bottom: 10px; }
  .sync-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .sync-row:last-child { margin-bottom: 0; }
  .sync-row input { flex: 1; min-width: 0; }
  .sync-btn {
    padding: 11px 18px; font-size: 15px; font-family: inherit; border: none; border-radius: 999px;
    background: #333; color: #fff; cursor: pointer; white-space: nowrap;
  }
  .sync-btn.ghost { background: #f0f0f0; color: #666; }
  .sync-btn:active { transform: translateY(1px); }
  .entry-overlay {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(0, 0, 0, .45);
    display: none; align-items: flex-end; justify-content: center;
  }
  .entry-overlay.show { display: flex; }
  .entry-sheet {
    width: 100%; max-width: 480px; background: #fff;
    border-radius: 20px 20px 0 0; padding: 16px 16px 24px;
    box-shadow: 0 -4px 24px rgba(0, 0, 0, .2);
  }
  .entry-title { font-size: 18px; font-weight: 700; text-align: center; margin: 2px 0 6px; }
  .entry-title.out { color: #dd1f16; }
  .entry-title.in { color: #1a9e54; }
  .entry-actions { display: flex; gap: 8px; margin-top: 16px; }
  .entry-actions button {
    flex: 1; padding: 13px 0; font-size: 16px; font-family: inherit; border: none;
    border-radius: 999px; cursor: pointer; letter-spacing: 2px;
  }
  #entryCancel { background: #f0f0f0; color: #666; }
  #entryOk { background: #333; color: #fff; box-shadow: 0 3px 0 rgba(0, 0, 0, .25); }
  #entryOk:active { transform: translateY(2px); box-shadow: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>阿华手帐本</h1>
  <p class="sub">每天记一笔，今日、本月、本年一目了然</p>

  <div class="card summary">
    <h2>收支汇总</h2>
    <div class="sum-row">
      <span class="sum-label">今日</span>
      <span class="sum-vals">
        <span class="in">收入 <span id="todayIn">0.00</span></span> &nbsp;
        <span class="out">支出 <span id="todayOut">0.00</span></span><br>
        <span class="bal">结余 <span id="todayBal">0.00</span></span>
      </span>
    </div>
    <div class="sum-row">
      <span class="sum-label">本月</span>
      <span class="sum-vals">
        <span class="in">收入 <span id="monthIn">0.00</span></span> &nbsp;
        <span class="out">支出 <span id="monthOut">0.00</span></span><br>
        <span class="bal">结余 <span id="monthBal">0.00</span></span>
      </span>
    </div>
    <div class="sum-row">
      <span class="sum-label">本年</span>
      <span class="sum-vals">
        <span class="in">收入 <span id="yearIn">0.00</span></span> &nbsp;
        <span class="out">支出 <span id="yearOut">0.00</span></span><br>
        <span class="bal">结余 <span id="yearBal">0.00</span></span>
      </span>
    </div>
  </div>

  <div class="card">
    <h2>云同步</h2>
    <div class="sync-status" id="syncStatus">未登录，账只存在这台手机上</div>
    <div id="syncLogin">
      <div class="sync-row">
        <input type="text" id="syncUser" placeholder="账号，例如 ahua" maxlength="32" autocomplete="username">
      </div>
      <div class="sync-row">
        <input type="password" id="syncPass" placeholder="密码，至少 4 位" autocomplete="current-password">
        <button type="button" class="sync-btn" id="syncLoginBtn">登录 / 注册</button>
      </div>
    </div>
    <div id="syncLoggedIn" style="display:none">
      <div class="sync-row">
        <button type="button" class="sync-btn" id="syncNowBtn">立即同步</button>
        <button type="button" class="sync-btn ghost" id="syncLogoutBtn">退出登录</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>记一笔</h2>
    <div class="type-row">
      <button type="button" class="type-btn" id="btnOut">支出</button>
      <button type="button" class="type-btn" id="btnIn">收入</button>
    </div>
  </div>

  <div class="card">
    <h2>今日明细</h2>
    <div id="todayList"></div>
  </div>

  <div class="card">
    <h2>全部明细</h2>
    <div id="allList"></div>
  </div>

  <p class="foot">数据只存在这台手机这个浏览器里，换设备不同步<br>点每条右边的 × 可以删掉那一笔</p>
</div>

<div class="entry-overlay" id="entryOverlay">
  <div class="entry-sheet">
    <div class="entry-title out" id="entryTitle">记一笔支出</div>
    <label for="mAmount">金额（元）</label>
    <input type="number" id="mAmount" inputmode="decimal" min="0" step="0.01" placeholder="0.00">
    <label>分类</label>
    <div class="cat-chips" id="catChips"></div>
    <label for="mDate">日期</label>
    <input type="date" id="mDate">
    <label for="mNote">备注（可选）</label>
    <input type="text" id="mNote" placeholder="例如 午饭、打车" maxlength="40">
    <div class="entry-actions">
      <button type="button" id="entryCancel">取消</button>
      <button type="button" id="entryOk">确定</button>
    </div>
  </div>
</div>

<script>
(function () {
  var KEY = "ledger_v1";
  var OUT_CATS = ["餐饮", "交通", "购物", "住房", "娱乐", "医疗", "其他"];
  var IN_CATS = ["工资", "副业", "红包", "其他"];
  var type = "out";
  var selectedCat = OUT_CATS[0];

  var entryOverlay = document.getElementById("entryOverlay");
  var entryTitle = document.getElementById("entryTitle");
  var mAmount = document.getElementById("mAmount");
  var mDate = document.getElementById("mDate");
  var mNote = document.getElementById("mNote");
  var catChips = document.getElementById("catChips");

  function todayStr() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function save(list) {
    localStorage.setItem(KEY, JSON.stringify(list));
    localStorage.setItem(TS_KEY, String(Date.now()));
  }
  function getTs() {
    return Number(localStorage.getItem(TS_KEY) || 0);
  }

  // ---- 云同步（Cloudflare Worker + KV）----
  var WORKER_URL = "https://ahua-ledger-sync.wangzhanghua001023.workers.dev";
  var AUTH_KEY = "ledger_auth_v1";
  var TS_KEY = "ledger_updated_at";
  var syncStatusEl = document.getElementById("syncStatus");
  var syncLoginEl = document.getElementById("syncLogin");
  var syncLoggedInEl = document.getElementById("syncLoggedIn");

  function setStatus(t) { syncStatusEl.textContent = t; }
  function getAuth() {
    try { return JSON.parse(localStorage.getItem(AUTH_KEY)) || null; }
    catch (e) { return null; }
  }
  function saveAuth(a) { localStorage.setItem(AUTH_KEY, JSON.stringify(a)); }
  function clearAuth() { localStorage.removeItem(AUTH_KEY); }
  function showLoggedIn(user) {
    syncLoginEl.style.display = "none";
    syncLoggedInEl.style.display = "block";
    setStatus("已登录：" + user + "，记账后自动同步到云上");
  }
  function showLoggedOut() {
    syncLoginEl.style.display = "block";
    syncLoggedInEl.style.display = "none";
    setStatus("未登录，账只存在这台手机上");
  }
  async function sha256Hex(str) {
    var buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(function (b) {
      return b.toString(16).padStart(2, "0");
    }).join("");
  }
  async function pushSync() {
    var auth = getAuth();
    if (!auth || !WORKER_URL) return false;
    try {
      var res = await fetch(WORKER_URL + "/api/sync", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ user: auth.user, passHash: auth.passHash, data: load(), updatedAt: getTs() }),
      });
      if (res.status === 401) {
        clearAuth();
        showLoggedOut();
        setStatus("密码不对，请重新登录");
        return false;
      }
      if (!res.ok) { setStatus("同步失败，网络可能有问题，账还在本机"); return false; }
      setStatus("已登录：" + auth.user + "，已同步 " + new Date().toLocaleString());
      return true;
    } catch (e) {
      setStatus("同步失败，网络可能有问题，账还在本机");
      return false;
    }
  }
  async function pullSync() {
    var auth = getAuth();
    if (!auth || !WORKER_URL) return false;
    try {
      var res = await fetch(WORKER_URL + "/api/sync?user=" + encodeURIComponent(auth.user) + "&passHash=" + auth.passHash);
      if (res.status === 401) {
        clearAuth();
        showLoggedOut();
        setStatus("密码不对，请重新登录");
        return false;
      }
      if (res.status === 404) { await pushSync(); return true; }
      if (!res.ok) { setStatus("同步失败，网络可能有问题，账还在本机"); return false; }
      var body = await res.json();
      var serverTs = body.updatedAt || 0;
      if (serverTs > getTs()) {
        save(body.data || []);
        render();
        setStatus("已登录：" + auth.user + "，已从云端拉取最新账本");
      } else if (getTs() > serverTs) {
        await pushSync();
      } else {
        setStatus("已登录：" + auth.user + "，云端和本机已经是最新");
      }
      return true;
    } catch (e) {
      setStatus("同步失败，网络可能有问题，账还在本机");
      return false;
    }
  }
  async function loginSync() {
    if (!WORKER_URL) { alert("同步服务还没部署好，稍后再试"); return; }
    var user = document.getElementById("syncUser").value.trim();
    var pass = document.getElementById("syncPass").value;
    if (!/^[A-Za-z0-9_.\-@]{3,32}$/.test(user)) { alert("账号用 3-32 位字母、数字或 _ . - @"); return; }
    if (pass.length < 4) { alert("密码至少 4 位"); return; }
    var passHash = await sha256Hex(pass);
    setStatus("正在登录…");
    try {
      var res = await fetch(WORKER_URL + "/api/sync?user=" + encodeURIComponent(user) + "&passHash=" + passHash);
      if (res.status === 401) { alert("密码不对"); showLoggedOut(); return; }
      if (res.status === 404) {
        if (!confirm("这个账号还没注册，要用这个密码注册，并把本机的账同步到云上吗？")) { showLoggedOut(); return; }
        saveAuth({ user: user, passHash: passHash });
        if (await pushSync()) showLoggedIn(user);
        return;
      }
      if (!res.ok) { alert("登录失败，网络可能有问题"); showLoggedOut(); return; }
      var body = await res.json();
      saveAuth({ user: user, passHash: passHash });
      var localTs = getTs();
      if ((body.updatedAt || 0) > localTs) {
        save(body.data || []);
        render();
      } else if (localTs > (body.updatedAt || 0)) {
        await pushSync();
      }
      showLoggedIn(user);
    } catch (e) {
      alert("登录失败，网络可能有问题");
      showLoggedOut();
    }
  }
  document.getElementById("syncLoginBtn").addEventListener("click", loginSync);
  document.getElementById("syncNowBtn").addEventListener("click", async function () {
    setStatus("正在同步…");
    await pullSync();
    await pushSync();
  });
  document.getElementById("syncLogoutBtn").addEventListener("click", function () {
    clearAuth();
    showLoggedOut();
  });
  function money(n) { return (Math.round(n * 100) / 100).toFixed(2); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function fillCats() {
    var cats = type === "out" ? OUT_CATS : IN_CATS;
    selectedCat = cats[0];
    catChips.innerHTML = "";
    cats.forEach(function (c) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "cat-chip" + (c === selectedCat ? (type === "out" ? " on-out" : " on-in") : "");
      b.textContent = c;
      b.addEventListener("click", function () {
        selectedCat = c;
        var chips = catChips.querySelectorAll(".cat-chip");
        chips.forEach(function (x) { x.className = "cat-chip"; });
        b.className = "cat-chip" + (type === "out" ? " on-out" : " on-in");
      });
      catChips.appendChild(b);
    });
  }
  function openEntry(t) {
    type = t;
    entryTitle.textContent = t === "out" ? "记一笔支出" : "记一笔收入";
    entryTitle.className = "entry-title " + t;
    fillCats();
    mAmount.value = "";
    mNote.value = "";
    mDate.value = todayStr();
    entryOverlay.classList.add("show");
    setTimeout(function () { mAmount.focus(); }, 50);
  }
  function closeEntry() { entryOverlay.classList.remove("show"); }
  function confirmEntry() {
    var amount = Math.round(parseFloat(mAmount.value) * 100) / 100;
    if (!amount || amount <= 0) { alert("先填一个大于 0 的金额"); mAmount.focus(); return; }
    if (!mDate.value) { alert("先选一个日期"); return; }
    var list = load();
    list.push({
      id: Date.now(),
      type: type,
      date: mDate.value,
      amount: amount,
      cat: selectedCat,
      note: mNote.value.trim()
    });
    save(list);
    closeEntry();
    render();
    pushSync();
  }

  document.getElementById("btnOut").addEventListener("click", function () { openEntry("out"); });
  document.getElementById("btnIn").addEventListener("click", function () { openEntry("in"); });
  document.getElementById("entryOk").addEventListener("click", confirmEntry);
  document.getElementById("entryCancel").addEventListener("click", closeEntry);
  entryOverlay.addEventListener("click", function (e) { if (e.target === entryOverlay) closeEntry(); });

  function sum(list, pred) {
    var income = 0, out = 0;
    list.forEach(function (r) {
      if (!pred(r)) return;
      if (r.type === "in") income += r.amount;
      else out += r.amount;
    });
    return { income: income, out: out };
  }
  function render() {
    var list = load();
    var today = todayStr();
    var ym = today.slice(0, 7);
    var y = today.slice(0, 4);
    var t = sum(list, function (r) { return r.date === today; });
    var m = sum(list, function (r) { return r.date.slice(0, 7) === ym; });
    var yy = sum(list, function (r) { return r.date.slice(0, 4) === y; });
    document.getElementById("todayIn").textContent = money(t.income);
    document.getElementById("todayOut").textContent = money(t.out);
    document.getElementById("todayBal").textContent = money(t.income - t.out);
    document.getElementById("monthIn").textContent = money(m.income);
    document.getElementById("monthOut").textContent = money(m.out);
    document.getElementById("monthBal").textContent = money(m.income - m.out);
    document.getElementById("yearIn").textContent = money(yy.income);
    document.getElementById("yearOut").textContent = money(yy.out);
    document.getElementById("yearBal").textContent = money(yy.income - yy.out);

    var sorted = list.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.id - a.id;
    });
    renderList(document.getElementById("todayList"), sorted.filter(function (r) { return r.date === today; }), "今天还没有记账");
    renderList(document.getElementById("allList"), sorted, "还没有任何记录");
  }
  function renderList(box, rows, emptyText) {
    box.innerHTML = "";
    if (!rows.length) {
      var p = document.createElement("p");
      p.className = "empty"; p.textContent = emptyText;
      box.appendChild(p);
      return;
    }
    rows.forEach(function (r) {
      var div = document.createElement("div");
      div.className = "item";
      var sign = r.type === "in" ? "+" : "-";
      var cls = r.type === "in" ? "in" : "out";
      var meta = r.date + (r.note ? " · " + r.note : "");
      div.innerHTML =
        '<div class="left"><div class="cat">' + esc(r.cat) + '</div>' +
        '<div class="meta">' + esc(meta) + '</div></div>' +
        '<div class="right"><span class="amt ' + cls + '">' + sign + money(r.amount) + '</span>' +
        '<button type="button" class="del" data-id="' + r.id + '" aria-label="删除">×</button></div>';
      box.appendChild(div);
    });
    box.querySelectorAll(".del").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = Number(b.getAttribute("data-id"));
        save(load().filter(function (r) { return r.id !== id; }));
        render();
        pushSync();
      });
    });
  }

  render();
  if (WORKER_URL && getAuth()) {
    showLoggedIn(getAuth().user);
    pullSync();
  }
})();
</script>
</body>
</html>
