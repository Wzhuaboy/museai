<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>记账本</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f2f2; color: #333;
    display: flex; justify-content: center; padding: 20px 14px 40px;
  }
  .wrap { width: 100%; max-width: 480px; }
  h1 { text-align: center; font-size: 24px; margin: 6px 0 4px; letter-spacing: 2px; }
  .sub { text-align: center; font-size: 13px; color: #999; margin: 0 0 16px; line-height: 1.6; }
  .card {
    background: #fff; border-radius: 16px; padding: 16px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, .08); margin-bottom: 14px;
  }
  .card h2 { font-size: 16px; margin: 0 0 12px; }
  .summary h2 { margin-bottom: 10px; }
  .sum-row { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 2px; border-bottom: 1px solid #f0f0f0; }
  .sum-row:last-child { border-bottom: none; }
  .sum-label { font-size: 15px; font-weight: 700; }
  .sum-vals { text-align: right; font-size: 14px; line-height: 1.7; }
  .in { color: #1a9e54; }
  .out { color: #dd1f16; }
  .bal { color: #333; font-weight: 700; }
  .type-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .type-btn {
    flex: 1; padding: 11px 0; font-size: 16px; font-family: inherit; border-radius: 999px;
    border: 2px solid #ddd; background: #fff; color: #666; cursor: pointer;
  }
  .type-btn.on-out { border-color: #dd1f16; background: #dd1f16; color: #fff; }
  .type-btn.on-in { border-color: #1a9e54; background: #1a9e54; color: #fff; }
  label { display: block; font-size: 14px; color: #666; margin: 10px 0 5px; }
  input, select {
    width: 100%; padding: 12px; font-size: 16px; font-family: inherit;
    border: 1px solid #ddd; border-radius: 10px; background: #fff; color: #333;
  }
  input:focus, select:focus { outline: none; border-color: #333; }
  #addBtn {
    width: 100%; margin-top: 16px; padding: 13px 0; font-size: 17px; font-family: inherit;
    border: none; border-radius: 999px; background: #333; color: #fff; cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 3px 0 rgba(0, 0, 0, .25);
  }
  #addBtn:active { transform: translateY(2px); box-shadow: none; }
  .item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 11px 2px; border-bottom: 1px solid #f0f0f0;
  }
  .item:last-child { border-bottom: none; }
  .item .left { min-width: 0; }
  .item .cat { font-size: 15px; font-weight: 700; }
  .item .meta { font-size: 12px; color: #999; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  .item .right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .item .amt { font-size: 16px; font-weight: 700; }
  .del { border: none; background: none; color: #bbb; font-size: 18px; cursor: pointer; padding: 4px 6px; }
  .del:active { color: #dd1f16; }
  .empty { text-align: center; color: #aaa; font-size: 14px; padding: 12px 0 4px; }
  .foot { text-align: center; font-size: 12px; color: #aaa; line-height: 1.7; margin-top: 6px; }
  .calc-overlay {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; z-index: 10;
    background: rgba(0, 0, 0, .45);
    display: none; align-items: flex-end; justify-content: center;
  }
  .calc-overlay.show { display: flex; }
  .calc-sheet {
    width: 100%; max-width: 480px; background: #fff;
    border-radius: 20px 20px 0 0; padding: 16px 16px 24px;
    box-shadow: 0 -4px 24px rgba(0, 0, 0, .2);
  }
  .calc-title { font-size: 16px; font-weight: 700; text-align: center; margin: 2px 0 10px; }
  .calc-display {
    background: #f6f6f6; border-radius: 12px; padding: 12px 14px; margin-bottom: 12px;
    text-align: right; min-height: 64px;
  }
  .calc-expr { font-size: 15px; color: #999; min-height: 20px; word-break: break-all; }
  .calc-result { font-size: 28px; font-weight: 700; line-height: 1.3; word-break: break-all; }
  .calc-result.out { color: #dd1f16; }
  .calc-result.in { color: #1a9e54; }
  .calc-keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .calc-key {
    padding: 15px 0; font-size: 20px; font-family: inherit; border: none; border-radius: 12px;
    background: #f0f0f0; color: #333; cursor: pointer;
  }
  .calc-key:active { background: #ddd; }
  .calc-key.op { background: #ffe9e7; color: #dd1f16; }
  .calc-key.eq { background: #333; color: #fff; }
  .calc-key.fn { background: #e8e8e8; color: #666; font-size: 17px; }
  .calc-actions { display: flex; gap: 8px; margin-top: 12px; }
  .calc-actions button {
    flex: 1; padding: 13px 0; font-size: 16px; font-family: inherit; border: none;
    border-radius: 999px; cursor: pointer; letter-spacing: 2px;
  }
  #calcCancel { background: #f0f0f0; color: #666; }
  #calcOk { background: #333; color: #fff; box-shadow: 0 3px 0 rgba(0, 0, 0, .25); }
  #calcOk:active { transform: translateY(2px); box-shadow: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>记账本</h1>
  <p class="sub">每天记一笔，今日、本月、本年一目了然</p>

  <div class="card summary">
    <h2>收支汇总</h2>
    <div class="sum-row">
      <span class="sum-label">今日</span>
      <span class="sum-vals">
        <span class="in">收入 <span id="todayIn">0.00</span></span> &nbsp;
        <span class="out">支出 <span id="todayOut">0.00</span></span><br>
        <span class="bal">结余 <span id="todayBal">0.00</span></span>
      </span>
    </div>
    <div class="sum-row">
      <span class="sum-label">本月</span>
      <span class="sum-vals">
        <span class="in">收入 <span id="monthIn">0.00</span></span> &nbsp;
        <span class="out">支出 <span id="monthOut">0.00</span></span><br>
        <span class="bal">结余 <span id="monthBal">0.00</span></span>
      </span>
    </div>
    <div class="sum-row">
      <span class="sum-label">本年</span>
      <span class="sum-vals">
        <span class="in">收入 <span id="yearIn">0.00</span></span> &nbsp;
        <span class="out">支出 <span id="yearOut">0.00</span></span><br>
        <span class="bal">结余 <span id="yearBal">0.00</span></span>
      </span>
    </div>
  </div>

  <div class="card">
    <h2>记一笔</h2>
    <div class="type-row">
      <button type="button" class="type-btn on-out" id="btnOut">支出</button>
      <button type="button" class="type-btn" id="btnIn">收入</button>
    </div>
    <label for="dateInput">日期</label>
    <input type="date" id="dateInput">
    <label for="amountInput">金额（元）· 点支出 / 收入可用计算器多笔加总</label>
    <input type="number" id="amountInput" inputmode="decimal" min="0" step="0.01" placeholder="例如 25.5">
    <label for="catInput">分类</label>
    <select id="catInput"></select>
    <label for="noteInput">备注（可选）</label>
    <input type="text" id="noteInput" placeholder="例如 午饭、打车" maxlength="40">
    <button type="button" id="addBtn">记下来</button>
  </div>

  <div class="card">
    <h2>今日明细</h2>
    <div id="todayList"></div>
  </div>

  <div class="card">
    <h2>全部明细</h2>
    <div id="allList"></div>
  </div>

  <p class="foot">数据只存在这台手机这个浏览器里，换设备不同步<br>点每条右边的 × 可以删掉那一笔</p>
</div>

<div class="calc-overlay" id="calcOverlay">
  <div class="calc-sheet">
    <div class="calc-title" id="calcTitle">支出计算器</div>
    <div class="calc-display">
      <div class="calc-expr" id="calcExpr"></div>
      <div class="calc-result out" id="calcResult">0</div>
    </div>
    <div class="calc-keys" id="calcKeys">
      <button type="button" class="calc-key fn" data-k="C">C</button>
      <button type="button" class="calc-key fn" data-k="B">⌫</button>
      <button type="button" class="calc-key op" data-k="/">÷</button>
      <button type="button" class="calc-key op" data-k="*">×</button>
      <button type="button" class="calc-key" data-k="7">7</button>
      <button type="button" class="calc-key" data-k="8">8</button>
      <button type="button" class="calc-key" data-k="9">9</button>
      <button type="button" class="calc-key op" data-k="-">−</button>
      <button type="button" class="calc-key" data-k="4">4</button>
      <button type="button" class="calc-key" data-k="5">5</button>
      <button type="button" class="calc-key" data-k="6">6</button>
      <button type="button" class="calc-key op" data-k="+">＋</button>
      <button type="button" class="calc-key" data-k="1">1</button>
      <button type="button" class="calc-key" data-k="2">2</button>
      <button type="button" class="calc-key" data-k="3">3</button>
      <button type="button" class="calc-key eq" data-k="=">=</button>
      <button type="button" class="calc-key" data-k="0">0</button>
      <button type="button" class="calc-key" data-k="00">00</button>
      <button type="button" class="calc-key" data-k=".">.</button>
      <button type="button" class="calc-key fn" data-k="OK">确定</button>
    </div>
    <div class="calc-actions">
      <button type="button" id="calcCancel">取消</button>
      <button type="button" id="calcOk">确定填入金额</button>
    </div>
  </div>
</div>

<script>
(function () {
  var KEY = "ledger_v1";
  var OUT_CATS = ["餐饮", "交通", "购物", "住房", "娱乐", "医疗", "其他"];
  var IN_CATS = ["工资", "副业", "红包", "其他"];
  var type = "out";

  var btnOut = document.getElementById("btnOut");
  var btnIn = document.getElementById("btnIn");
  var dateInput = document.getElementById("dateInput");
  var amountInput = document.getElementById("amountInput");
  var catInput = document.getElementById("catInput");
  var noteInput = document.getElementById("noteInput");

  function todayStr() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }
  function load() {
    try { return JSON.parse(localStorage.getItem(KEY)) || []; }
    catch (e) { return []; }
  }
  function save(list) {
    localStorage.setItem(KEY, JSON.stringify(list));
  }
  function money(n) { return (Math.round(n * 100) / 100).toFixed(2); }
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function fillCats() {
    var cats = type === "out" ? OUT_CATS : IN_CATS;
    catInput.innerHTML = "";
    cats.forEach(function (c) {
      var o = document.createElement("option");
      o.value = c; o.textContent = c;
      catInput.appendChild(o);
    });
  }
  function setType(t) {
    type = t;
    btnOut.className = "type-btn" + (t === "out" ? " on-out" : "");
    btnIn.className = "type-btn" + (t === "in" ? " on-in" : "");
    fillCats();
  }
  // ---- 计算器：点支出 / 收入弹出，可多笔加总 ----
  var calcOverlay = document.getElementById("calcOverlay");
  var calcExprEl = document.getElementById("calcExpr");
  var calcResultEl = document.getElementById("calcResult");
  var calcTitle = document.getElementById("calcTitle");
  var calcExpr = "";
  var calcDone = false;

  function calcEval(expr) {
    var tokens = expr.match(/(\d+\.?\d*|\.\d+|[+\-*/])/g);
    if (!tokens || !tokens.length) return 0;
    var nums = [], ops = [];
    var i, t;
    for (i = 0; i < tokens.length; i++) {
      t = tokens[i];
      if (t === "+" || t === "-" || t === "*" || t === "/") ops.push(t);
      else nums.push(parseFloat(t));
    }
    if (nums.length === 0) return 0;
    if (ops.length >= nums.length) ops.length = nums.length - 1;
    var n2 = [nums[0]], o2 = [];
    for (i = 0; i < ops.length; i++) {
      if (ops[i] === "*" || ops[i] === "/") {
        var a = n2.pop(), b = nums[i + 1];
        if (ops[i] === "/" && b === 0) return NaN;
        n2.push(ops[i] === "*" ? a * b : a / b);
      } else {
        o2.push(ops[i]);
        n2.push(nums[i + 1]);
      }
    }
    var v = n2[0];
    for (i = 0; i < o2.length; i++) v = o2[i] === "+" ? v + n2[i + 1] : v - n2[i + 1];
    return Math.round(v * 100) / 100;
  }
  function calcShow() {
    calcExprEl.textContent = calcExpr.replace(/\*/g, "×").replace(/\//g, "÷").replace(/-/g, "−");
    var v = calcExpr ? calcEval(calcExpr) : 0;
    calcResultEl.textContent = isNaN(v) ? "算错了" : money(v);
  }
  function calcOpen() {
    calcTitle.textContent = type === "out" ? "支出计算器" : "收入计算器";
    calcResultEl.className = "calc-result " + type;
    var cur = parseFloat(amountInput.value);
    calcExpr = cur > 0 ? String(cur) : "";
    calcDone = false;
    calcShow();
    calcOverlay.classList.add("show");
  }
  function calcClose() { calcOverlay.classList.remove("show"); }
  function calcConfirm() {
    var v = calcExpr ? calcEval(calcExpr) : 0;
    if (isNaN(v) || v <= 0) { alert("先算出一个大于 0 的金额"); return; }
    amountInput.value = money(v);
    calcClose();
  }
  function calcPress(k) {
    if (k === "C") { calcExpr = ""; calcDone = false; calcShow(); return; }
    if (k === "B") {
      calcExpr = calcExpr.slice(0, -1);
      calcDone = false; calcShow(); return;
    }
    if (k === "=") {
      var v = calcExpr ? calcEval(calcExpr) : 0;
      if (isNaN(v)) { calcExpr = ""; calcShow(); return; }
      calcExpr = String(v);
      calcDone = true; calcShow(); return;
    }
    if (k === "OK") { calcConfirm(); return; }
    if (k === "+" || k === "-" || k === "*" || k === "/") {
      if (!calcExpr) return;
      if (/[+\-*/]$/.test(calcExpr)) calcExpr = calcExpr.slice(0, -1) + k;
      else calcExpr += k;
      calcDone = false; calcShow(); return;
    }
    if (k === ".") {
      var seg = calcExpr.split(/[+\-*/]/).pop();
      if (seg.indexOf(".") !== -1) return;
      calcExpr += seg === "" ? "0." : ".";
      calcDone = false; calcShow(); return;
    }
    if (calcDone) { calcExpr = ""; calcDone = false; }
    if (calcExpr === "0" && k === "0") return;
    if (calcExpr === "0") calcExpr = k === "00" ? "0" : k;
    else calcExpr += k;
    calcShow();
  }
  document.getElementById("calcKeys").addEventListener("click", function (e) {
    var b = e.target.closest("[data-k]");
    if (b) calcPress(b.getAttribute("data-k"));
  });
  document.getElementById("calcOk").addEventListener("click", calcConfirm);
  document.getElementById("calcCancel").addEventListener("click", calcClose);
  calcOverlay.addEventListener("click", function (e) { if (e.target === calcOverlay) calcClose(); });

  btnOut.addEventListener("click", function () { setType("out"); calcOpen(); });
  btnIn.addEventListener("click", function () { setType("in"); calcOpen(); });

  function sum(list, pred) {
    var income = 0, out = 0;
    list.forEach(function (r) {
      if (!pred(r)) return;
      if (r.type === "in") income += r.amount;
      else out += r.amount;
    });
    return { income: income, out: out };
  }
  function render() {
    var list = load();
    var today = todayStr();
    var ym = today.slice(0, 7);
    var y = today.slice(0, 4);
    var t = sum(list, function (r) { return r.date === today; });
    var m = sum(list, function (r) { return r.date.slice(0, 7) === ym; });
    var yy = sum(list, function (r) { return r.date.slice(0, 4) === y; });
    document.getElementById("todayIn").textContent = money(t.income);
    document.getElementById("todayOut").textContent = money(t.out);
    document.getElementById("todayBal").textContent = money(t.income - t.out);
    document.getElementById("monthIn").textContent = money(m.income);
    document.getElementById("monthOut").textContent = money(m.out);
    document.getElementById("monthBal").textContent = money(m.income - m.out);
    document.getElementById("yearIn").textContent = money(yy.income);
    document.getElementById("yearOut").textContent = money(yy.out);
    document.getElementById("yearBal").textContent = money(yy.income - yy.out);

    var sorted = list.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? 1 : -1;
      return b.id - a.id;
    });
    renderList(document.getElementById("todayList"), sorted.filter(function (r) { return r.date === today; }), "今天还没有记账");
    renderList(document.getElementById("allList"), sorted, "还没有任何记录");
  }
  function renderList(box, rows, emptyText) {
    box.innerHTML = "";
    if (!rows.length) {
      var p = document.createElement("p");
      p.className = "empty"; p.textContent = emptyText;
      box.appendChild(p);
      return;
    }
    rows.forEach(function (r) {
      var div = document.createElement("div");
      div.className = "item";
      var sign = r.type === "in" ? "+" : "-";
      var cls = r.type === "in" ? "in" : "out";
      var meta = r.date + (r.note ? " · " + r.note : "");
      div.innerHTML =
        '<div class="left"><div class="cat">' + esc(r.cat) + '</div>' +
        '<div class="meta">' + esc(meta) + '</div></div>' +
        '<div class="right"><span class="amt ' + cls + '">' + sign + money(r.amount) + '</span>' +
        '<button type="button" class="del" data-id="' + r.id + '" aria-label="删除">×</button></div>';
      box.appendChild(div);
    });
    box.querySelectorAll(".del").forEach(function (b) {
      b.addEventListener("click", function () {
        var id = Number(b.getAttribute("data-id"));
        save(load().filter(function (r) { return r.id !== id; }));
        render();
      });
    });
  }

  document.getElementById("addBtn").addEventListener("click", function () {
    var amount = Math.round(parseFloat(amountInput.value) * 100) / 100;
    if (!amount || amount <= 0) { alert("先填一个大于 0 的金额"); amountInput.focus(); return; }
    if (!dateInput.value) { alert("先选一个日期"); return; }
    var list = load();
    list.push({
      id: Date.now(),
      type: type,
      date: dateInput.value,
      amount: amount,
      cat: catInput.value,
      note: noteInput.value.trim()
    });
    save(list);
    amountInput.value = "";
    noteInput.value = "";
    render();
  });

  dateInput.value = todayStr();
  setType("out");
  render();
})();
</script>
</body>
</html>
