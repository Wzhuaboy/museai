<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>数字合并</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f2f2; color: #333;
    display: flex; justify-content: center; padding: 20px 14px 32px;
  }
  .wrap { width: 100%; max-width: 480px; }
  h1 { text-align: center; font-size: 24px; margin: 6px 0 4px; letter-spacing: 2px; }
  .sub { text-align: center; font-size: 14px; color: #777; margin: 0 0 16px; line-height: 1.7; }
  .board {
    display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 8px;
    aspect-ratio: 1 / 1; width: 100%;
    background: #8d8d8d; border-radius: 16px; padding: 10px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .25), inset 0 2px 0 rgba(255, 255, 255, .35);
  }
  .cell {
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 700; line-height: 1; user-select: none; -webkit-user-select: none;
    transition: transform .08s ease;
  }
  .tile { cursor: pointer; box-shadow: 0 3px 0 rgba(0, 0, 0, .18), inset 0 2px 0 rgba(255, 255, 255, .45); }
  .tile:active { transform: scale(.94); }
  .tile.bump { animation: bump .18s ease; }
  .tile.merged { animation: pop .5s ease; }
  .tile.merging { animation: mergePulse .7s ease infinite; }
  .tile.falling { animation: drop .6s ease; }
  .tile.spawned { animation: spawn .6s ease; }
  @keyframes bump { 40% { transform: scale(1.12); } }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes mergePulse {
    0%, 100% { transform: scale(1); box-shadow: 0 3px 0 rgba(0, 0, 0, .18), inset 0 2px 0 rgba(255, 255, 255, .45); }
    50% { transform: scale(1.1); box-shadow: 0 0 0 3px #fff, 0 0 18px rgba(255, 255, 255, .95), inset 0 2px 0 rgba(255, 255, 255, .45); }
  }
  @keyframes drop { from { transform: translateY(var(--drop, -112%)); opacity: .5; } to { transform: translateY(0); opacity: 1; } }
  @keyframes spawn { from { transform: translateY(-90%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .lives {
    text-align: center; font-size: 17px; margin: 0 0 12px; color: #333;
  }
  .lives b { font-size: 22px; color: #dd1f16; }
  .lives .lives-note { font-size: 13px; color: #999; }
  .lives.out b { color: #999; }
  .lives.out .lives-note { color: #dd1f16; }
  .empty {
    background: rgba(0, 0, 0, .12); box-shadow: inset 0 2px 6px rgba(0, 0, 0, .25);
    cursor: default;
  }
  .actions { display: flex; justify-content: center; margin-top: 18px; }
  #resetBtn {
    font-size: 16px; font-family: inherit; padding: 12px 28px; border: none; border-radius: 999px;
    background: #333; color: #fff; cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 3px 0 rgba(0, 0, 0, .25);
  }
  #resetBtn:active { transform: translateY(2px); box-shadow: none; }
  @media (max-width: 380px) { .cell { font-size: 28px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>数字合并</h1>
  <p class="sub">点格子 +1；上下左右连着的相同数字满 3 个就合并成一个 +1 的新方块，<br>
  留在你点的那格（连锁合并时留在该组最左上的那格）。合并后上面的数字掉下来，<br>
  最上面补下面四行已有的数字（随机抽一个），不会出现 0。合完立刻再扫全盘，<br>
  直到没有可合并的为止。2 个相连不合并。</p>
  <div class="lives" id="livesBar">剩余点击 <b id="livesNum">5</b> 次<span class="lives-note" id="livesNote"> · 点一次 -1，合并一次 +1</span></div>
  <div class="board" id="board"></div>
  <div class="actions"><button id="resetBtn" type="button">重置本局</button></div>
</div>
<script>
(function () {
  "use strict";
  var ROWS = 5, COLS = 5;
  // 开局盘面：按参考图 5x5 排布，初始无可合并组
  var INITIAL = [
    [5, 7, 1, 4, 1],
    [6, 3, 4, 1, 6],
    [2, 7, 2, 7, 4],
    [6, 3, 6, 3, 7],
    [1, 6, 3, 8, 1]
  ];
  // 数字配色（1-8 贴近参考图，9 起按色相轮换；0 的配色留作兜底，正常玩不到 0）
  var PALETTE = [
    { bg: "#6b6f7d", fg: "#fff" },  // 0 灰蓝（兜底）
    { bg: "#f4f4f4", fg: "#222" },  // 1 白
    { bg: "#f6f1d8", fg: "#222" },  // 2 米白
    { bg: "#f2bd7d", fg: "#fff" },  // 3 浅橙
    { bg: "#ef8a3c", fg: "#fff" },  // 4 橙
    { bg: "#e8442a", fg: "#fff" },  // 5 红
    { bg: "#dd1f16", fg: "#fff" },  // 6 深红
    { bg: "#f0d23e", fg: "#fff" },  // 7 黄
    { bg: "#d7c400", fg: "#fff" }   // 8 黄绿
  ];
  var HUES = [280, 210, 160, 320, 20, 190, 250, 100];

  // 空格子只用 null 表示；新数字只从下面四行抽，0 不会出现
  function isEmpty(v) { return v === null; }

  // 每次合并分三步慢慢走：先闪要合的那组，再弹出新方块，最后掉落补新
  var T_HIGHLIGHT = 700, T_POP = 450, T_FALL = 600;
  // 生命周期：每局 5 次点击，点一次 -1，合并一次 +1
  var START_LIVES = 5;

  var board = clone(INITIAL);
  var busy = false;
  var lives = START_LIVES;
  var boardEl = document.getElementById("board");
  var resetBtn = document.getElementById("resetBtn");
  var livesBar = document.getElementById("livesBar");
  var livesNumEl = document.getElementById("livesNum");
  var livesNoteEl = document.getElementById("livesNote");

  function updateLives() {
    livesNumEl.textContent = lives;
    if (lives <= 0) {
      livesBar.classList.add("out");
      livesNoteEl.textContent = " · 次数用完了，点重置本局重新开始";
    } else {
      livesBar.classList.remove("out");
      livesNoteEl.textContent = " · 点一次 -1，合并一次 +1";
    }
  }

  function clone(src) {
    return src.map(function (row) { return row.slice(); });
  }
  function colorFor(n) {
    if (PALETTE[n]) return PALETTE[n];
    var hue = HUES[(n - 9) % HUES.length];
    return { bg: "hsl(" + hue + ", 65%, 52%)", fg: "#fff" };
  }
  function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  // opts: { bump:[r,c], merged:[r,c], merging:[[r,c]...], falls:{"r,c":掉几格}, spawned:[[r,c]...] }
  function render(opts) {
    opts = opts || {};
    boardEl.innerHTML = "";
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var cell = document.createElement("div");
        cell.className = "cell";
        var v = board[r][c];
        if (isEmpty(v)) {
          cell.classList.add("empty");
        } else {
          var col = colorFor(v);
          cell.classList.add("tile");
          cell.style.background = col.bg;
          cell.style.color = col.fg;
          cell.textContent = v;
          cell.dataset.r = r;
          cell.dataset.c = c;
          if (opts.bump && opts.bump[0] === r && opts.bump[1] === c) cell.classList.add("bump");
          if (opts.merged && opts.merged[0] === r && opts.merged[1] === c) {
            cell.classList.add("merged");
          } else if (opts.falls && opts.falls[r + "," + c]) {
            cell.style.setProperty("--drop", (-opts.falls[r + "," + c] * 112) + "%");
            cell.classList.add("falling");
          }
          if (opts.merging && groupHas({ cells: opts.merging }, [r, c])) cell.classList.add("merging");
          if (opts.spawned && groupHas({ cells: opts.spawned }, [r, c])) cell.classList.add("spawned");
        }
        boardEl.appendChild(cell);
      }
    }
  }

  // 四连通找组：返回所有同值连通组（只含数字格，空位不参与）
  function findGroups() {
    var seen = [];
    for (var r = 0; r < ROWS; r++) {
      seen.push([]);
      for (var c = 0; c < COLS; c++) seen[r].push(false);
    }
    var groups = [];
    var dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    for (var sr = 0; sr < ROWS; sr++) {
      for (var sc = 0; sc < COLS; sc++) {
        var v = board[sr][sc];
        if (isEmpty(v) || seen[sr][sc]) continue;
        var group = [];
        var stack = [[sr, sc]];
        seen[sr][sc] = true;
        while (stack.length) {
          var cur = stack.pop();
          group.push(cur);
          for (var i = 0; i < dirs.length; i++) {
            var nr = cur[0] + dirs[i][0], nc = cur[1] + dirs[i][1];
            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
            if (seen[nr][nc] || board[nr][nc] !== v) continue;
            seen[nr][nc] = true;
            stack.push([nr, nc]);
          }
        }
        groups.push({ value: v, cells: group });
      }
    }
    return groups;
  }

  function samePos(a, b) { return a[0] === b[0] && a[1] === b[1]; }
  function groupHas(group, pos) {
    for (var i = 0; i < group.cells.length; i++) {
      if (samePos(group.cells[i], pos)) return true;
    }
    return false;
  }
  // 组内最左上（行优先）的格子
  function firstCell(group) {
    var best = group.cells[0];
    for (var i = 1; i < group.cells.length; i++) {
      var p = group.cells[i];
      if (p[0] < best[0] || (p[0] === best[0] && p[1] < best[1])) best = p;
    }
    return best;
  }

  // 掉落 + 补新：每列数字沉到底；顶上空出来的格子，从下面四行
  // （第 2-5 行）已有的数字里随机抽一个补上，0 永远不会出现；
  // 返回 { newAnchor: 新方块掉落后的位置, falls: {"r,c": 掉了几格}, spawned: [[r,c]...] }
  function settle(anchor) {
    var newAnchor = anchor;
    var falls = {};
    for (var c = 0; c < COLS; c++) {
      if (anchor && c === anchor[1]) {
        var below = 0;
        for (var rb = anchor[0] + 1; rb < ROWS; rb++) {
          if (board[rb][c] !== null) below++;
        }
        newAnchor = [ROWS - 1 - below, c];
      }
      for (var r = 0; r < ROWS; r++) {
        if (board[r][c] === null) continue;
        var cnt = 0;
        for (var rr = r; rr < ROWS; rr++) {
          if (board[rr][c] !== null) cnt++;
        }
        var newRow = ROWS - cnt;
        if (newRow > r) falls[newRow + "," + c] = newRow - r;
      }
      var vals = [];
      for (var r4 = ROWS - 1; r4 >= 0; r4--) {
        if (board[r4][c] !== null) vals.push(board[r4][c]);
      }
      for (var r2 = ROWS - 1, i = 0; r2 >= 0; r2--, i++) {
        board[r2][c] = i < vals.length ? vals[i] : null;
      }
    }
    var pool = [];
    for (var pr = 1; pr < ROWS; pr++) {
      for (var pc = 0; pc < COLS; pc++) {
        if (board[pr][pc] !== null) pool.push(board[pr][pc]);
      }
    }
    var spawned = [];
    for (var fc = 0; fc < COLS; fc++) {
      for (var fr = 0; fr < ROWS; fr++) {
        if (board[fr][fc] === null) {
          board[fr][fc] = pool.length
            ? pool[Math.floor(Math.random() * pool.length)]
            : 1 + Math.floor(Math.random() * 9); // 兜底：下面四行万一全空，补 1-9
          spawned.push([fr, fc]);
        }
      }
    }
    return { newAnchor: newAnchor, falls: falls, spawned: spawned };
  }

  // 合并循环：每次只合第一组（行优先扫描到的第一组），分三步慢慢走；
  // 每合一次 +1 次点击；合完立刻重扫全盘
  async function resolveMerges(clickPos) {
    var steps = 0;
    while (true) {
      if (++steps > 100) return; // 兜底：补的新数字理论上可能反复成组，防页面卡死
      var groups = findGroups().filter(function (g) { return g.cells.length >= 3; });
      if (!groups.length) return;
      var g = groups[0];
      render({ merging: g.cells });
      await sleep(T_HIGHLIGHT);
      var anchor = (clickPos && groupHas(g, clickPos)) ? clickPos : firstCell(g);
      for (var i = 0; i < g.cells.length; i++) {
        board[g.cells[i][0]][g.cells[i][1]] = null;
      }
      board[anchor[0]][anchor[1]] = g.value + 1;
      render({ merged: anchor });
      await sleep(T_POP);
      var res = settle(anchor);
      render({ merged: res.newAnchor, falls: res.falls, spawned: res.spawned });
      await sleep(T_FALL);
      lives += 1;
      updateLives();
    }
  }

  boardEl.addEventListener("click", function (e) {
    var t = e.target;
    if (busy || !t.classList || !t.classList.contains("tile")) return;
    if (lives <= 0) return;
    var r = parseInt(t.dataset.r, 10), c = parseInt(t.dataset.c, 10);
    if (isEmpty(board[r][c])) return;
    busy = true;
    lives -= 1;
    updateLives();
    board[r][c] += 1;
    render({ bump: [r, c] });
    resolveMerges([r, c]).then(function () { busy = false; });
  });

  resetBtn.addEventListener("click", function () {
    if (busy) return;
    board = clone(INITIAL);
    lives = START_LIVES;
    updateLives();
    render({});
  });

  updateLives();
  render({});
})();
</script>
</body>
</html>
