<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>数字合并</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f2f2; color: #333;
    display: flex; justify-content: center; padding: 20px 14px 32px;
  }
  .wrap { width: 100%; max-width: 480px; }
  .fd {
    text-align: center; font-size: 22px; font-weight: 900; font-style: italic;
    letter-spacing: 4px; margin: 2px 0 10px;
    background: linear-gradient(90deg, #ff5f6d, #ffc371, #7b61ff, #00c6ff);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    filter: drop-shadow(0 2px 6px rgba(123, 97, 255, .35));
  }
  .topbar { display: flex; align-items: center; gap: 10px; }
  .topbar .fd { flex: 1; }
  .score {
    flex-shrink: 0; min-width: 64px; text-align: center;
    background: #fff; border-radius: 12px; padding: 6px 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
  }
  .score-label { display: block; font-size: 12px; color: #999; letter-spacing: 2px; }
  .score-num { display: block; font-size: 22px; font-weight: 800; color: #dd1f16; line-height: 1.2; }
  .score-num.pop { animation: scorePop .3s ease; }
  @keyframes scorePop { 40% { transform: scale(1.35); } }
  .poem {
    margin-top: 18px; background: #fff; border-radius: 12px; padding: 14px 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
  }
  .poem-text {
    font-family: "STKaiti", "KaiTi", "STKaiti", serif;
    font-size: 17px; line-height: 1.6; text-align: center; color: #333;
  }
  .poem-author { text-align: right; font-size: 13px; color: #999; margin-top: 6px; }
  .poem.swap .poem-text, .poem.swap .poem-author { animation: poemIn .5s ease; }
  @keyframes poemIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  h1 { text-align: center; font-size: 24px; margin: 6px 0 4px; letter-spacing: 2px; }
  .board {
    display: grid; grid-template-columns: repeat(5, 1fr); grid-template-rows: repeat(5, 1fr); gap: 8px;
    aspect-ratio: 1 / 1; width: 100%;
    background: #8d8d8d; border-radius: 16px; padding: 10px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, .25), inset 0 2px 0 rgba(255, 255, 255, .35);
  }
  .cell {
    border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 34px; font-weight: 700; line-height: 1; user-select: none; -webkit-user-select: none;
    transition: transform .08s ease;
  }
  .tile { cursor: pointer; box-shadow: 0 3px 0 rgba(0, 0, 0, .18), inset 0 2px 0 rgba(255, 255, 255, .45); }
  .tile:active { transform: scale(.94); }
  .tile.bump { animation: bump .18s ease; }
  .tile.merged { animation: pop .5s ease; }
  .tile.merging { animation: mergePulse .7s ease infinite; }
  .tile.falling { animation: drop .6s ease; }
  .tile.spawned { animation: spawn .6s ease; }
  @keyframes bump { 40% { transform: scale(1.12); } }
  @keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @keyframes mergePulse {
    0%, 100% { transform: scale(1); box-shadow: 0 3px 0 rgba(0, 0, 0, .18), inset 0 2px 0 rgba(255, 255, 255, .45); }
    50% { transform: scale(1.1); box-shadow: 0 0 0 3px #fff, 0 0 18px rgba(255, 255, 255, .95), inset 0 2px 0 rgba(255, 255, 255, .45); }
  }
  @keyframes drop { from { transform: translateY(var(--drop, -112%)); opacity: .5; } to { transform: translateY(0); opacity: 1; } }
  @keyframes spawn { from { transform: translateY(-90%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .lives {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    font-size: 14px; margin: 0 0 12px; color: #333;
  }
  .lives-label { white-space: nowrap; }
  .lives-track {
    flex: 1; min-width: 120px; display: flex; gap: 4px;
  }
  .lives-seg {
    flex: 1; height: 14px; border-radius: 4px;
    background: rgba(0, 0, 0, .12);
    box-shadow: inset 0 2px 4px rgba(0, 0, 0, .2);
    transition: background-color .3s ease;
  }
  .lives-seg.on { box-shadow: none; }
  .lives .lives-note { font-size: 12px; color: #999; white-space: nowrap; }
  .lives.out .lives-note { color: #dd1f16; }
  .empty {
    background: rgba(0, 0, 0, .12); box-shadow: inset 0 2px 6px rgba(0, 0, 0, .25);
    cursor: default;
  }
  .actions { display: flex; justify-content: center; margin-top: 18px; }
  #resetBtn {
    font-size: 16px; font-family: inherit; padding: 12px 28px; border: none; border-radius: 999px;
    background: #333; color: #fff; cursor: pointer; letter-spacing: 2px;
    box-shadow: 0 3px 0 rgba(0, 0, 0, .25);
  }
  #resetBtn:active { transform: translateY(2px); box-shadow: none; }
  @media (max-width: 380px) { .cell { font-size: 28px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="fd">-FD防沉迷-</div>
    <div class="score" id="scoreBox"><span class="score-label">得分</span><span class="score-num" id="scoreNum">0</span></div>
  </div>
  <h1>数字合并</h1>
  <div class="lives" id="livesBar">
    <span class="lives-label">剩余点击</span>
    <div class="lives-track" id="livesTrack"><div class="lives-seg"></div><div class="lives-seg"></div><div class="lives-seg"></div><div class="lives-seg"></div><div class="lives-seg"></div></div>
    <span class="lives-note" id="livesNote">点一次 -1，合并一次 +1</span>
  </div>
  <div class="board" id="board"></div>
  <div class="actions"><button id="resetBtn" type="button">重置本局</button></div>
  <div class="poem" id="poemBox">
    <div class="poem-text" id="poemText"></div>
    <div class="poem-author" id="poemAuthor"></div>
  </div>
</div>
<script>
(function () {
  "use strict";
  var ROWS = 5, COLS = 5;
  // 固定开局（兜底）：按参考图 5x5 排布，初始无可合并组；正常开局走 randomBoard() 随机生成
  var INITIAL = [
    [5, 7, 1, 4, 1],
    [6, 3, 4, 1, 6],
    [2, 7, 2, 7, 4],
    [6, 3, 6, 3, 7],
    [1, 6, 3, 8, 1]
  ];
  // 数字配色（1-8 贴近参考图，9 起按色相轮换；0 的配色留作兜底，正常玩不到 0）
  var PALETTE = [
    { bg: "#6b6f7d", fg: "#fff" },  // 0 灰蓝（兜底）
    { bg: "#f4f4f4", fg: "#222" },  // 1 白
    { bg: "#f6f1d8", fg: "#222" },  // 2 米白
    { bg: "#f2bd7d", fg: "#fff" },  // 3 浅橙
    { bg: "#ef8a3c", fg: "#fff" },  // 4 橙
    { bg: "#e8442a", fg: "#fff" },  // 5 红
    { bg: "#dd1f16", fg: "#fff" },  // 6 深红
    { bg: "#f0d23e", fg: "#fff" },  // 7 黄
    { bg: "#d7c400", fg: "#fff" }   // 8 黄绿
  ];
  var HUES = [280, 210, 160, 320, 20, 190, 250, 100];

  // 空格子只用 null 表示；新数字只从下面四行抽，0 不会出现
  function isEmpty(v) { return v === null; }

  // 每次合并分三步慢慢走：先闪要合的那组，再弹出新方块，最后掉落补新
  var T_HIGHLIGHT = 700, T_POP = 450, T_FALL = 600;
  // 生命周期：每局 5 次点击，点一次 -1，合并一次 +1
  var START_LIVES = 5;

  // 开局盘面：每次重置都随机生成（1-8），保证初始无可合并组；
  // 200 次都撞上可合并组时回落到固定开局 INITIAL（实际几乎不会发生）
  function randomBoard() {
    for (var attempt = 0; attempt < 200; attempt++) {
      var b = [];
      for (var r = 0; r < ROWS; r++) {
        b.push([]);
        for (var c = 0; c < COLS; c++) {
          b[r].push(1 + Math.floor(Math.random() * 8));
        }
      }
      board = b;
      var bad = findGroups().some(function (g) { return g.cells.length >= 3; });
      if (!bad) return b;
    }
    return clone(INITIAL);
  }

  var board = randomBoard();
  var busy = false;
  var lives = START_LIVES;
  var boardEl = document.getElementById("board");
  var resetBtn = document.getElementById("resetBtn");
  var livesBar = document.getElementById("livesBar");
  var livesSegs = document.getElementById("livesTrack").querySelectorAll(".lives-seg");
  var livesNoteEl = document.getElementById("livesNote");

  function updateLives() {
    // 五格隔断：亮着的格子数 = 剩余次数；满 5 格绿色（hue 120），剩 1 格红色（hue 0），中间渐变
    var hue = lives <= 0 ? 0 : Math.round((lives - 1) / (START_LIVES - 1) * 120);
    for (var i = 0; i < livesSegs.length; i++) {
      if (i < lives) {
        livesSegs[i].classList.add("on");
        livesSegs[i].style.background = "hsl(" + hue + ", 70%, 45%)";
      } else {
        livesSegs[i].classList.remove("on");
        livesSegs[i].style.background = "";
      }
    }
    if (lives <= 0) {
      livesBar.classList.add("out");
      livesNoteEl.textContent = "次数用完了，点重置本局重新开始";
    } else {
      livesBar.classList.remove("out");
      livesNoteEl.textContent = "点一次 -1，合并一次 +1";
    }
  }

  function clone(src) {
    return src.map(function (row) { return row.slice(); });
  }
  function colorFor(n) {
    if (PALETTE[n]) return PALETTE[n];
    var hue = HUES[(n - 9) % HUES.length];
    return { bg: "hsl(" + hue + ", 65%, 52%)", fg: "#fff" };
  }
  function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  // 短音效：WebAudio 现场合成，不用额外音频文件；每种动作一个音
  var audioCtx = null;
  function tone(freq, dur, type, vol, delay) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var t0 = audioCtx.currentTime + (delay || 0);
      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      osc.type = type || "sine";
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(vol || 0.15, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) { /* 没声音也不影响玩 */ }
  }
  function sfxClick() { tone(520, 0.06, "square", 0.07); }
  function sfxMerge(v) { // 合并：两个音上扬，合出的数字越大音越高
    var base = 440 + Math.min(v, 12) * 40;
    tone(base, 0.12, "sine", 0.18);
    tone(base * 1.5, 0.16, "sine", 0.18, 0.07);
  }
  function sfxSpawn() { tone(880, 0.05, "triangle", 0.06); }
  function sfxOut() { tone(180, 0.25, "sawtooth", 0.09); }
  function sfxReset() { tone(660, 0.07, "triangle", 0.12); tone(990, 0.09, "triangle", 0.12, 0.06); }

  // 掉落数字：纯随机，小数字权重高（容易凑三连，难度下来了；但凑三连仍要花点击，不会白给）
  // 1:30% 2:25% 3:20% 4:15% 5:10%，不再从盘面现有数字里抽
  var DROP_WEIGHTS = [[1, 30], [2, 25], [3, 20], [4, 15], [5, 10]];
  function randomDrop() {
    var total = 0, i;
    for (i = 0; i < DROP_WEIGHTS.length; i++) total += DROP_WEIGHTS[i][1];
    var roll = Math.random() * total, acc = 0;
    for (i = 0; i < DROP_WEIGHTS.length; i++) {
      acc += DROP_WEIGHTS[i][1];
      if (roll < acc) return DROP_WEIGHTS[i][0];
    }
    return 1;
  }

  // 古诗库：直接嵌在页面里（唐宋名句，均为公版），不用单独建库文件；
  // 以后想加到几百首，再拆成 poems.json 单独加载
  var POEMS = [
    { text: "一泊沙来一泊去，一重浪灭一重生。", author: "【唐】白居易" },
    { text: "床前明月光，疑是地上霜。", author: "【唐】李白" },
    { text: "朝辞白帝彩云间，千里江陵一日还。", author: "【唐】李白" },
    { text: "飞流直下三千尺，疑是银河落九天。", author: "【唐】李白" },
    { text: "桃花潭水深千尺，不及汪伦送我情。", author: "【唐】李白" },
    { text: "好雨知时节，当春乃发生。", author: "【唐】杜甫" },
    { text: "两个黄鹂鸣翠柳，一行白鹭上青天。", author: "【唐】杜甫" },
    { text: "会当凌绝顶，一览众山小。", author: "【唐】杜甫" },
    { text: "留连戏蝶时时舞，自在娇莺恰恰啼。", author: "【唐】杜甫" },
    { text: "红豆生南国，春来发几枝。", author: "【唐】王维" },
    { text: "明月松间照，清泉石上流。", author: "【唐】王维" },
    { text: "空山新雨后，天气晚来秋。", author: "【唐】王维" },
    { text: "春眠不觉晓，处处闻啼鸟。", author: "【唐】孟浩然" },
    { text: "碧玉妆成一树高，万条垂下绿丝绦。", author: "【唐】贺知章" },
    { text: "离离原上草，一岁一枯荣。", author: "【唐】白居易" },
    { text: "乱花渐欲迷人眼，浅草才能没马蹄。", author: "【唐】白居易" },
    { text: "白日依山尽，黄河入海流。", author: "【唐】王之涣" },
    { text: "欲穷千里目，更上一层楼。", author: "【唐】王之涣" },
    { text: "白毛浮绿水，红掌拨清波。", author: "【唐】骆宾王" },
    { text: "春蚕到死丝方尽，蜡炬成灰泪始干。", author: "【唐】李商隐" },
    { text: "清明时节雨纷纷，路上行人欲断魂。", author: "【唐】杜牧" },
    { text: "谁言寸草心，报得三春晖。", author: "【唐】孟郊" },
    { text: "自古逢秋悲寂寥，我言秋日胜春朝。", author: "【唐】刘禹锡" },
    { text: "但愿人长久，千里共婵娟。", author: "【宋】苏轼" },
    { text: "不识庐山真面目，只缘身在此山中。", author: "【宋】苏轼" },
    { text: "生当作人杰，死亦为鬼雄。", author: "【宋】李清照" },
    { text: "众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。", author: "【宋】辛弃疾" },
    { text: "山重水复疑无路，柳暗花明又一村。", author: "【宋】陆游" },
    { text: "小荷才露尖尖角，早有蜻蜓立上头。", author: "【宋】杨万里" },
    { text: "墙角数枝梅，凌寒独自开。", author: "【宋】王安石" }
  ];

  // 得分：3 个合 10 分，4 个合 30 分，5 个合 50 分，6 个及以上合 100 分
  var score = 0;
  var scoreNumEl = document.getElementById("scoreNum");
  var poemBoxEl = document.getElementById("poemBox");
  var poemTextEl = document.getElementById("poemText");
  var poemAuthorEl = document.getElementById("poemAuthor");
  var lastPoem = -1;

  function scoreFor(n) {
    if (n === 3) return 10;
    if (n === 4) return 30;
    if (n === 5) return 50;
    return 100;
  }
  function updateScore() {
    scoreNumEl.textContent = score;
    scoreNumEl.classList.remove("pop");
    void scoreNumEl.offsetWidth;
    scoreNumEl.classList.add("pop");
  }
  function showPoem() {
    var idx = lastPoem;
    while (idx === lastPoem) idx = Math.floor(Math.random() * POEMS.length);
    lastPoem = idx;
    poemTextEl.textContent = POEMS[idx].text;
    poemAuthorEl.textContent = POEMS[idx].author;
    poemBoxEl.classList.remove("swap");
    void poemBoxEl.offsetWidth;
    poemBoxEl.classList.add("swap");
  }

  // opts: { bump:[r,c], merged:[r,c], merging:[[r,c]...], falls:{"r,c":掉几格}, spawned:[[r,c]...] }
  function render(opts) {
    opts = opts || {};
    boardEl.innerHTML = "";
    for (var r = 0; r < ROWS; r++) {
      for (var c = 0; c < COLS; c++) {
        var cell = document.createElement("div");
        cell.className = "cell";
        var v = board[r][c];
        if (isEmpty(v)) {
          cell.classList.add("empty");
        } else {
          var col = colorFor(v);
          cell.classList.add("tile");
          cell.style.background = col.bg;
          cell.style.color = col.fg;
          cell.textContent = v;
          cell.dataset.r = r;
          cell.dataset.c = c;
          if (opts.bump && opts.bump[0] === r && opts.bump[1] === c) cell.classList.add("bump");
          if (opts.merged && opts.merged[0] === r && opts.merged[1] === c) {
            cell.classList.add("merged");
          } else if (opts.falls && opts.falls[r + "," + c]) {
            cell.style.setProperty("--drop", (-opts.falls[r + "," + c] * 112) + "%");
            cell.classList.add("falling");
          }
          if (opts.merging && groupHas({ cells: opts.merging }, [r, c])) cell.classList.add("merging");
          if (opts.spawned && groupHas({ cells: opts.spawned }, [r, c])) cell.classList.add("spawned");
        }
        boardEl.appendChild(cell);
      }
    }
  }

  // 四连通找组：返回所有同值连通组（只含数字格，空位不参与）
  function findGroups() {
    var seen = [];
    for (var r = 0; r < ROWS; r++) {
      seen.push([]);
      for (var c = 0; c < COLS; c++) seen[r].push(false);
    }
    var groups = [];
    var dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    for (var sr = 0; sr < ROWS; sr++) {
      for (var sc = 0; sc < COLS; sc++) {
        var v = board[sr][sc];
        if (isEmpty(v) || seen[sr][sc]) continue;
        var group = [];
        var stack = [[sr, sc]];
        seen[sr][sc] = true;
        while (stack.length) {
          var cur = stack.pop();
          group.push(cur);
          for (var i = 0; i < dirs.length; i++) {
            var nr = cur[0] + dirs[i][0], nc = cur[1] + dirs[i][1];
            if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) continue;
            if (seen[nr][nc] || board[nr][nc] !== v) continue;
            seen[nr][nc] = true;
            stack.push([nr, nc]);
          }
        }
        groups.push({ value: v, cells: group });
      }
    }
    return groups;
  }

  function samePos(a, b) { return a[0] === b[0] && a[1] === b[1]; }
  function groupHas(group, pos) {
    for (var i = 0; i < group.cells.length; i++) {
      if (samePos(group.cells[i], pos)) return true;
    }
    return false;
  }
  // 组内最左上（行优先）的格子
  function firstCell(group) {
    var best = group.cells[0];
    for (var i = 1; i < group.cells.length; i++) {
      var p = group.cells[i];
      if (p[0] < best[0] || (p[0] === best[0] && p[1] < best[1])) best = p;
    }
    return best;
  }

  // 掉落 + 补新：每列数字沉到底；顶上空出来的格子用加权随机数补（1-5，小数字更常见），0 永远不会出现；
  // 返回 { newAnchor: 新方块掉落后的位置, falls: {"r,c": 掉了几格}, spawned: [[r,c]...] }
  function settle(anchor) {
    var newAnchor = anchor;
    var falls = {};
    for (var c = 0; c < COLS; c++) {
      if (anchor && c === anchor[1]) {
        var below = 0;
        for (var rb = anchor[0] + 1; rb < ROWS; rb++) {
          if (board[rb][c] !== null) below++;
        }
        newAnchor = [ROWS - 1 - below, c];
      }
      for (var r = 0; r < ROWS; r++) {
        if (board[r][c] === null) continue;
        var cnt = 0;
        for (var rr = r; rr < ROWS; rr++) {
          if (board[rr][c] !== null) cnt++;
        }
        var newRow = ROWS - cnt;
        if (newRow > r) falls[newRow + "," + c] = newRow - r;
      }
      var vals = [];
      for (var r4 = ROWS - 1; r4 >= 0; r4--) {
        if (board[r4][c] !== null) vals.push(board[r4][c]);
      }
      for (var r2 = ROWS - 1, i = 0; r2 >= 0; r2--, i++) {
        board[r2][c] = i < vals.length ? vals[i] : null;
      }
    }
    var spawned = [];
    for (var fc = 0; fc < COLS; fc++) {
      for (var fr = 0; fr < ROWS; fr++) {
        if (board[fr][fc] === null) {
          board[fr][fc] = randomDrop();
          spawned.push([fr, fc]);
        }
      }
    }
    return { newAnchor: newAnchor, falls: falls, spawned: spawned };
  }

  // 合并循环：每次只合第一组（行优先扫描到的第一组），分三步慢慢走；
  // 每合一次 +1 次点击；合完立刻重扫全盘
  async function resolveMerges(clickPos) {
    var steps = 0;
    while (true) {
      if (++steps > 100) return; // 兜底：补的新数字理论上可能反复成组，防页面卡死
      var groups = findGroups().filter(function (g) { return g.cells.length >= 3; });
      if (!groups.length) return;
      var g = groups[0];
      render({ merging: g.cells });
      await sleep(T_HIGHLIGHT);
      var anchor = (clickPos && groupHas(g, clickPos)) ? clickPos : firstCell(g);
      for (var i = 0; i < g.cells.length; i++) {
        board[g.cells[i][0]][g.cells[i][1]] = null;
      }
      board[anchor[0]][anchor[1]] = g.value + 1;
      sfxMerge(g.value + 1);
      score += scoreFor(g.cells.length);
      updateScore();
      showPoem();
      render({ merged: anchor });
      await sleep(T_POP);
      var res = settle(anchor);
      if (res.spawned.length) sfxSpawn();
      render({ merged: res.newAnchor, falls: res.falls, spawned: res.spawned });
      await sleep(T_FALL);
      lives = Math.min(START_LIVES, lives + 1); // 总次数最高 5 次，合并补 1 但不超 5
      updateLives();
    }
  }

  boardEl.addEventListener("click", function (e) {
    var t = e.target;
    if (busy || !t.classList || !t.classList.contains("tile")) return;
    if (lives <= 0) return;
    var r = parseInt(t.dataset.r, 10), c = parseInt(t.dataset.c, 10);
    if (isEmpty(board[r][c])) return;
    busy = true;
    lives -= 1;
    updateLives();
    board[r][c] += 1;
    sfxClick();
    render({ bump: [r, c] });
    resolveMerges([r, c]).then(function () { busy = false; if (lives <= 0) sfxOut(); });
  });

  resetBtn.addEventListener("click", function () {
    if (busy) return;
    board = randomBoard();
    lives = START_LIVES;
    score = 0;
    updateLives();
    updateScore();
    showPoem();
    sfxReset();
    render({});
  });

  updateLives();
  updateScore();
  showPoem();
  render({});
})();
</script>
</body>
</html>
